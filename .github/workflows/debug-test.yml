name: Debug Test

on:
  workflow_dispatch:

jobs:
  debug-files:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: List files
      run: |
        echo "=== Current directory ==="
        pwd
        echo "=== All files ==="
        ls -la
        echo "=== Python files ==="
        find . -name "*.py"
        echo "=== Contents of repository ==="
        tree || ls -R
